name: Build OpenCode for Termux

on:
  workflow_dispatch:
    inputs:
      version:
        description: 上游 npm 发布版本号（默认 1.18.23，可自行选择）
        required: false
        default: "1.18.23"
      publish:
        description: 构建完成后是否发布到 GitHub Release
        required: false
        default: false
        type: boolean
  push:
    tags: ["v*"]

jobs:
  build:
    name: 构建 deb + pacman
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本
        env:
          VERSION_IN: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "push" ]]; then
            VER="${REF_NAME#v}"
          else
            VER="${VERSION_IN:-1.18.23}"
          fi
          echo "OPENCODE_VER=$VER" >> "$GITHUB_ENV"
          echo "构建版本=$VER (npm: opencode-linux-arm64@$VER)"

      - name: 包装（npm opencode-linux-arm64@VER）
        run: ./scripts/produce.sh "$OPENCODE_VER"

      - name: 结构校验
        run: |
          set -euo pipefail
          file runtime/opencode-termux
          python3 scripts/verify.py runtime/opencode-termux

      - name: 组装安装前缀（stage）
        run: ./scripts/build.sh

      - name: 构建 .deb
        run: VERSION="$OPENCODE_VER" ./scripts/package_deb.sh

      - name: 构建 pacman（需要 makepkg）
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y pacman-package-manager
          VERSION="$OPENCODE_VER" ./scripts/package_pacman.sh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: opencode-aarch64
          path: |
            opencode_*.deb
            packing/pacman/opencode-*.pkg.tar.xz
            runtime/opencode-termux
          retention-days: 7

  publish:
    name: 发布 Release
    runs-on: ubuntu-latest
    needs: build
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: opencode-aarch64
          path: out
      - name: 发布（不存在则创建，存在则覆盖资产）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DEB=$(ls out/opencode_*_aarch64.deb 2>/dev/null | head -n1)
          PKG=$(ls out/packing/pacman/opencode-*.pkg.tar.xz 2>/dev/null | head -n1)
          [[ -n "$DEB" ]] || { echo "no deb found"; exit 1; }
          [[ -n "$PKG" ]] || { echo "no pacman package found"; exit 1; }
          VER=$(basename "$DEB" | sed -E 's#opencode_([0-9]+\.[0-9]+\.[0-9]+)_aarch64\.deb#\1#')
          TAG="v$VER"
          ASSETS=("$DEB" "$PKG")
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG exists -> overwrite assets"
            gh release upload "$TAG" "${ASSETS[@]}" -R "$GITHUB_REPOSITORY" --clobber
          else
            echo "create release $TAG"
            gh release create "$TAG" "${ASSETS[@]}" -R "$GITHUB_REPOSITORY" \
              --title "OpenCode for Termux v$VER" \
              --notes "deb: \`opencode_${VER}_aarch64.deb\` · pacman: \`opencode-${VER}-1-aarch64.pkg.tar.xz\`" \
              --target "$GITHUB_SHA"
          fi